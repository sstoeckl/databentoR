# Weekly equivalence check: official Python client vs. databentoR.
# Requires repo secret DATABENTO_API_KEY. Activates once the repo is on
# GitHub (sstoeckl/databentoR) — pushing there needs Sebastian's go-ahead.
name: equivalence

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:

jobs:
  equivalence:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'sstoeckl'
    env:
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Python reference fixtures
        run: |
          pip install databento pyarrow pandas
          python dev/equivalence/make_reference.py

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
      - name: Run R tests incl. equivalence
        run: Rscript -e 'devtools::test(stop_on_failure = TRUE)'
