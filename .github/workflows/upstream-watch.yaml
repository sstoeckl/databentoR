# Watch the official Python client for changes the R port has to follow.
#
# Once a week this compares the pinned submodule against the newest upstream
# release. When a new release exists it re-captures the wire fixture with that
# release and diffs it against the committed one, so the issue it opens says
# exactly which parameters, endpoints or enum values changed rather than just
# "a new version is out".
name: upstream-watch

on:
  schedule:
    - cron: "23 6 * * 1"   # Mondays 06:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare the pin with the newest upstream release
        id: versions
        run: |
          cd dev/python-reference
          git fetch --tags --quiet origin
          PINNED=$(python -c "import re,pathlib;print(re.search(r'\"(.+)\"',pathlib.Path('databento/version.py').read_text()).group(1))")
          LATEST=$(git tag --sort=-v:refname | head -n1 | sed 's/^v//')
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$PINNED" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::databento-python $PINNED is current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::databento-python $LATEST is out; the pin is $PINNED."
          fi

      - name: Build the change report
        if: steps.versions.outputs.changed == 'true'
        env:
          PINNED: ${{ steps.versions.outputs.pinned }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install "./dev/python-reference"
          python dev/equivalence/wire_capture.py --out /tmp/wire_pinned.json

          cd dev/python-reference
          git checkout --quiet "v${LATEST}"
          cd -
          pip install "./dev/python-reference"
          python dev/equivalence/wire_capture.py --out /tmp/wire_latest.json

          {
            echo "The pinned Databento Python client is \`${PINNED}\`; upstream released \`${LATEST}\`."
            echo
            echo "## Wire changes that affect databentoR"
            echo
            echo '```diff'
            diff -u /tmp/wire_pinned.json /tmp/wire_latest.json | head -c 12000 || true
            echo '```'
            echo
            echo "## Changelog between the two releases"
            echo
            echo '```'
            awk -v from="${LATEST}" -v to="${PINNED}" \
              '$0 ~ "^## "from {p=1} $0 ~ "^## "to {p=0} p' \
              dev/python-reference/CHANGELOG.md | head -c 12000 || true
            echo '```'
            echo
            echo "## What to do"
            echo
            echo "1. \`git -C dev/python-reference checkout v${LATEST}\` and commit the new pin."
            echo "2. \`pip install ./dev/python-reference && python dev/equivalence/wire_capture.py\`."
            echo "3. Run \`devtools::test()\`. The wire and enum tests fail where the R port has to change."
            echo "4. Update \`R/parse.R\` and \`R/fields.R\` if schemas, symbol types or record fields moved."
            echo
            echo "_Opened automatically by \`.github/workflows/upstream-watch.yaml\`._"
          } > /tmp/report.md
          cat /tmp/report.md

      - name: Open or update the tracking issue
        if: steps.versions.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          TITLE="databento-python ${LATEST} is out: review the R port"
          EXISTING=$(gh issue list --state open --search "in:title databento-python" \
                       --json number,title --jq ".[] | select(.title==\"${TITLE}\") | .number" | head -n1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/report.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/report.md \
              --label "upstream" || \
            gh issue create --title "$TITLE" --body-file /tmp/report.md
          fi
